# Codex CLI configuration.

notify = ["sh", "-c", 'exec "$HOME/.codex/scripts/notify-turn-ended.sh" "$1"', "--"]

[[hooks.PermissionRequest]]
matcher = ".*"

[[hooks.PermissionRequest.hooks]]
type = "command"
command = "$HOME/.codex/scripts/notify-permission.sh"

[[hooks.Stop]]

[[hooks.Stop.hooks]]
type = "command"
command = "$HOME/.codex/scripts/notify-complete.sh"
